name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Menyiapkan keystore tetap dari GitHub Secrets. Tanpa secret, build memakai kunci debug bawaan.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/edgelite.jks"
            echo "EDGELITE_KEYSTORE_FILE=$RUNNER_TEMP/edgelite.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        env:
          EDGELITE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EDGELITE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EDGELITE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EdgeLite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
